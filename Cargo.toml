[package]
name = "bevy_sketch1"
version = "0.1.0"
edition = "2024"

[dependencies]
# Обратите внимание на синтаксис с features , features = ["dynamic_linking"] 
bevy = { version = "0.19.1", features = ["dynamic_linking"] }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
rand = "0.10.3"
bincode = "1.3" # Для сверхбыстрой бинарной сериализации
serde = { version = "1.0", features = ["derive"] } # Требуется для bincode

# Оптимизации для быстрой сборки
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"